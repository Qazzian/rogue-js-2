version: 2
registries:
  Qazzian:
    type: npm-registry
    url: https://gitlab.com/api/v4/projects/33965507/packages/npm/
    token: ${{secrets.GITLAB_NPM_TOKEN}}
updates:
  - package-ecosystem: 'npm'
    registries: ['Qazzian']
    directory: '/'
    schedule:
      interval: weekly
    groups:
      dev-deps:
        dependency-type: development
      prod-deps:
        dependency-type: production
    target-branch: main
    labels:
      - dependabot
      - dependencies
    ignore:
      - dependency-name: 'node'
        versions: ['20.x', '22.x', '24.x']
    commit-message:
      prefix: BAU

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions-deps:
        patterns:
          - '*'
    target-branch: main
    labels:
      - dependabot
      - dependencies
    commit-message:
      prefix: BAU
